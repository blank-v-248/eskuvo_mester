<!DOCTYPE html>
<html class="no-js">
<head>
	<meta charset="utf-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<title>Fotók – Blanka &amp; Dani</title>
	<meta name="viewport" content="width=device-width, initial-scale=1">

	<link href='https://fonts.googleapis.com/css?family=Work+Sans:400,300,600,400italic,700' rel='stylesheet' type='text/css'>
	<link href="https://fonts.googleapis.com/css?family=Sacramento" rel="stylesheet">
	<link rel="stylesheet" href="css/animate.css">
	<link rel="stylesheet" href="css/icomoon.css">
	<link rel="stylesheet" href="css/bootstrap.css">
	<link rel="stylesheet" href="css/style.css">

	<style>
		body { background: #2d5a27; }

		.back-bar {
			padding: 18px 0 0;
		}
		.back-bar a {
			font-family: 'Work Sans', sans-serif;
			font-size: 13px;
			font-weight: 600;
			color: #fff;
			text-decoration: none;
			letter-spacing: .04em;
			text-transform: uppercase;
			opacity: .8;
		}
		.back-bar a:hover { opacity: 1; text-decoration: underline; }
		.back-bar a::before { content: '← '; }

		.photos-heading {
			text-align: center;
			padding: 40px 0 32px;
		}
		.photos-heading span {
			font-family: 'Sacramento', cursive;
			font-size: 28px;
			color: #c8e6c4;
			display: block;
			margin-bottom: 4px;
		}
		.photos-heading h1 {
			font-family: 'Work Sans', sans-serif;
			font-size: 32px;
			font-weight: 300;
			color: #fff;
			margin: 0;
		}

		.photo-grid {
			display: grid;
			grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
			gap: 12px;
			padding-bottom: 60px;
		}

		.photo-item {
			position: relative;
			overflow: hidden;
			border-radius: 4px;
			background: #1e3d1a;
			aspect-ratio: 1 / 1;
			display: block;
			text-decoration: none;
		}
		.photo-item img {
			width: 100%;
			height: 100%;
			object-fit: cover;
			display: block;
			transition: transform .3s ease, filter .3s ease;
		}
		.photo-item:hover img {
			transform: scale(1.04);
			filter: brightness(.7);
		}
		.photo-item .download-hint {
			position: absolute;
			inset: 0;
			display: flex;
			align-items: center;
			justify-content: center;
			opacity: 0;
			transition: opacity .25s;
			pointer-events: none;
		}
		.photo-item:hover .download-hint { opacity: 1; }
		.download-hint span {
			background: rgba(255,255,255,.92);
			color: #333;
			font-family: 'Work Sans', sans-serif;
			font-size: 12px;
			font-weight: 600;
			letter-spacing: .06em;
			text-transform: uppercase;
			padding: 8px 16px;
			border-radius: 3px;
		}

		.empty-state {
			text-align: center;
			padding: 80px 0;
			color: rgba(255,255,255,.5);
			font-family: 'Work Sans', sans-serif;
			font-size: 15px;
		}

		@media (max-width: 480px) {
			.photo-grid { grid-template-columns: repeat(2, 1fr); gap: 8px; }
			.photos-heading h1 { font-size: 24px; }
		}
	</style>
</head>
<body>

<div class="container">
	<div class="back-bar">
		<a href="index.html">Vissza a főoldalra / Back to Home</a>
	</div>

	<div class="photos-heading">
		<span>Blanka &amp; Dani</span>
		<h1>Fotók / Images</h1>
	</div>

	<div class="photo-grid" id="photo-grid"></div>
	<div class="empty-state" id="empty-state" style="display:none;">Még nincsenek fotók feltöltve.</div>
</div>

<script>
	/* AUTO-GENERATED — do not edit this list by hand.
	   Run generate_photos.py after adding images to img/pics/ */
	var photos = [
		/* PHOTOS_START */
		"0mindenkinek.jpg",
		"mi.jpg",
		"1.jpg",
		"10.jpg",
		"1b.jpg",
		"2.jpg",
		"20.jpg",
		"20a.jpg",
		"23.jpg",
		"25.jpg",
		"33.jpg",
		"39.jpg",
		"4.jpg",
		"40.jpg",
		"48.jpg",
		"49.jpg",
		"5.jpg",
		"50.jpg",
		"52.jpg",
		"54.jpg",
		"56.jpg",
		"57.jpg",
		"58.jpg",
		"59.jpg",
		"8.jpg",
		"9.jpg",
		/* PHOTOS_END */
	];

	var grid = document.getElementById('photo-grid');
	var empty = document.getElementById('empty-state');

	if (photos.length === 0) {
		empty.style.display = 'block';
	} else {
		photos.forEach(function(filename) {
			var a = document.createElement('a');
			a.className = 'photo-item';
			a.href = 'images/pics/' + filename;
			a.download = filename;
			a.innerHTML =
				'<img src="images/pics/' + filename + '" alt="' + filename + '" loading="lazy">' +
				'<div class="download-hint"><span>⬇ Letöltés</span></div>';
			grid.appendChild(a);
		});
	}
</script>

</body>
</html>
